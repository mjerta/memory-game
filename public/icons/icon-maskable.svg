<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="m-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="m-card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="m-starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="m-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <filter id="m-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#fbbf24" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Full-bleed background for maskable icon -->
  <rect width="512" height="512" fill="url(#m-bg)" />

  <!-- Centered safe-zone group (scaled to fit within 80% circle safe zone) -->
  <g transform="translate(256, 256) scale(0.78) translate(-256, -256)">
    <!-- Left Card -->
    <g transform="translate(170, 260) rotate(-14) translate(-170, -260)" filter="url(#m-shadow)">
      <rect x="75" y="140" width="170" height="230" rx="18" fill="url(#m-card1)" stroke="#ffffff" stroke-width="6" />
      <circle cx="160" cy="255" r="42" fill="#ffffff" fill-opacity="0.15" />
      <text x="160" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="70" font-weight="900" fill="#ffffff" text-anchor="middle">?</text>
    </g>

    <!-- Right Card -->
    <g transform="translate(340, 255) rotate(14) translate(-340, -255)" filter="url(#m-shadow)">
      <rect x="255" y="135" width="170" height="230" rx="18" fill="#ffffff" stroke="#22c55e" stroke-width="6" />
      <path d="M 340 195 L 352 232 L 391 232 L 360 255 L 372 292 L 340 269 L 308 292 L 320 255 L 289 232 L 328 232 Z" fill="url(#m-starGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#m-glow)" />
      <circle cx="395" cy="165" r="18" fill="#22c55e" />
      <polyline points="386,165 393,172 405,158" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Decorative Sparkles -->
    <path d="M 120 110 Q 120 130 100 130 Q 120 130 120 150 Q 120 130 140 130 Q 120 130 120 110 Z" fill="#fde047" />
    <path d="M 410 95 Q 410 110 395 110 Q 410 110 410 125 Q 410 110 425 110 Q 410 110 410 95 Z" fill="#fde047" />
    <circle cx="256" cy="100" r="7" fill="#ffffff" fill-opacity="0.8" />
  </g>
</svg>
