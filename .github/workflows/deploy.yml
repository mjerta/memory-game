name: Angular CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  PROJECT: ${{ vars.DEPLOY_PROJECT || github.event.repository.name }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ vars.DEPLOY_PROJECT || github.event.repository.name }}
  IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}

jobs:
  build:
    name: Build Angular app image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: PORT=${{ vars.DEPLOY_PORT || '80' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on ThinkCentre
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull & start image on remote
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_PORT || '22' }}
          script: |
            set -euo pipefail
            "/opt/docker-setups/apps/${{ env.PROJECT }}/deploy-update.sh" "${{ env.PROJECT }}" "${{ env.IMAGE_TAG }}" "${{ vars.DEPLOY_PORT || '80' }}"
