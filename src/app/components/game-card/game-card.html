<button
  type="button"
  class="card"
  [attr.data-theme]="theme()"
  [class.hide-card-name]="!showCardName()"
  [class.flipped]="card().isFlipped || card().isMatched"
  [class.matched]="card().isMatched"
  [class.flip-left]="flipDirection() === 'left'"
  [class.flip-right]="flipDirection() === 'right'"
  [disabled]="card().isMatched || disabled()"
  (pointerdown)="onPointerDown($event)"
  (click)="onSelect($event)"
  [attr.aria-label]="card().isFlipped || card().isMatched ? cardName() : translations.t('card.hidden')"
>
  <div class="card-inner">
    <div class="card-back">
      <span class="card-back-pattern">?</span>
    </div>
    <div class="card-front">
      <img [src]="card().image" [alt]="cardName()" class="card-image" loading="lazy" />
      <span class="card-name">{{ cardName() }}</span>
    </div>
  </div>
</button>
